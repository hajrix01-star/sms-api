name: Android Build

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper --gradle-version 8.11.1
        fi
        chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish installable APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
        if gh release view apk-debug >/dev/null 2>&1; then
          gh release upload apk-debug "$APK#SMS-API-debug.apk" --clobber
        else
          gh release create apk-debug "$APK#SMS-API-debug.apk" --title "SMS API Debug" --notes "Installable debug build generated by GitHub Actions." --prerelease
        fi
