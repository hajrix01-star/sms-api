name: Android Build

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper --gradle-version 8.11.1
        fi
        chmod +x gradlew

    - name: Load stable signing key
      if: github.event_name != 'pull_request'
      env:
        SMS_API_KEYSTORE_BASE64: ${{ secrets.SMS_API_KEYSTORE_BASE64 }}
        SMS_API_KEYSTORE_PASSWORD: ${{ secrets.SMS_API_KEYSTORE_PASSWORD }}
        SMS_API_KEY_ALIAS: ${{ secrets.SMS_API_KEY_ALIAS }}
        SMS_API_KEY_PASSWORD: ${{ secrets.SMS_API_KEY_PASSWORD }}
      run: |
        test -n "$SMS_API_KEYSTORE_BASE64"
        test -n "$SMS_API_KEYSTORE_PASSWORD"
        test -n "$SMS_API_KEY_ALIAS"
        test -n "$SMS_API_KEY_PASSWORD"
        printf '%s' "$SMS_API_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms-api.keystore"
        echo "SMS_API_KEYSTORE_PATH=$RUNNER_TEMP/sms-api.keystore" >> "$GITHUB_ENV"
        echo "SMS_API_KEYSTORE_PASSWORD=$SMS_API_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
        echo "SMS_API_KEY_ALIAS=$SMS_API_KEY_ALIAS" >> "$GITHUB_ENV"
        echo "SMS_API_KEY_PASSWORD=$SMS_API_KEY_PASSWORD" >> "$GITHUB_ENV"

    - name: Build signed APK
      if: github.event_name != 'pull_request'
      run: ./gradlew assembleRelease

    - name: Build debug APK for pull requests
      if: github.event_name == 'pull_request'
      run: ./gradlew assembleDebug

    - name: Upload signed APK
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-signed
        path: app/build/outputs/apk/release/*.apk

    - name: Publish installable APK
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
        OUTPUT="$RUNNER_TEMP/app-debug.apk"
        cp "$APK" "$OUTPUT"
        if gh release view apk-debug >/dev/null 2>&1; then
          gh release upload apk-debug "$OUTPUT#SMS API signed release" --clobber
        else
          gh release create apk-debug "$OUTPUT#SMS API signed release" --title "SMS API" --notes "Installable APK signed with the persistent application key." --prerelease
        fi
